# adv.p2atech.com.br  ->  landing nichada em ADV TECH
server {
  listen 80;
  server_name adv.p2atech.com.br;

  root /usr/share/nginx/html;

  location = / {
    try_files /landing-page.html =404;
  }

  location / {
    try_files $uri $uri/ /landing-page.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}

# www.p2atech.com.br / p2atech.com.br (+ default) -> landing institucional (sem nicho)
server {
  listen 80 default_server;
  server_name www.p2atech.com.br p2atech.com.br _;

  root /usr/share/nginx/html;

  location = / {
    try_files /landing-institucional.html =404;
  }

  location / {
    try_files $uri $uri/ /landing-institucional.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
